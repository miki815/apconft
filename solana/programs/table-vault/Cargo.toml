[package]
name = "table-vault"
version = "0.1.0"
description = "Custodial SPL vault for table balance: deposit / withdraw with fee"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "table_vault"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
# 0.31.x: anchor-syn radi na novijem Rustu (1.85+); 0.30.1 lomi se na proc_macro2.
anchor-lang = { version = "0.31.1", features = ["init-if-needed"] }
anchor-spl = "0.31.1"
